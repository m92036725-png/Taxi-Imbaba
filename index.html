<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
:root{--taxi:#fff;--taxi2:#fff;--ck:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/10px 10px}
h1,h2,h3,#toast,#big,#spd,.tile b,.btn,.go,.chip,body{font-family:'Cairo',system-ui,sans-serif!important}
.card h1,.card h2,.logo h1,#load h1,#toast,#big,.vbar h3,#spd,.hdr h1{font-weight:900!important}
.btn:not(.alt),.go,.gar,#hint button,.opt.on,.tile em,.bt{color:#fff!important;border:0!important;text-shadow:0 1px 2px #000;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/8px 8px repeat-x,repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 100%/8px 8px repeat-x,#111!important;padding-top:calc(.7em + 4px);padding-bottom:calc(.7em + 4px)}
.stripe,.pb i{background:var(--ck)!important}
.tile,.back,.ic,.vbar{border-color:#fff!important}
.tile::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;border-radius:0 0 11px 11px;background:var(--ck)}
.tb,.phone .tb{background:rgba(0,0,0,.75)!important;border:3px solid #fff!important;color:#fff!important;font-weight:900;text-shadow:none}
.phone #bG,#bG{background:rgba(24,140,64,.88)!important}.phone #bB,#bB{background:rgba(200,40,40,.88)!important}
.tb span{display:block;font-size:calc(var(--tb,64px)*.34);line-height:1}.tb small{display:block;font-size:12px;font-weight:900;margin-top:2px}
.tb.on,.phone .tb.on{background:#fff!important;color:#000!important}
#goShop,#shop,#hint,#gfxMenu{display:none!important}
</style></head><body>
<title>تاكسي إمبابة (نسخة تجريبية)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: full-bleed WebGL canvas, HUD on top, thumb controls at the bottom corners, sunset city look */
:root{
  --ink:#0b1317; --panel:#121d23; --panel2:#18262e; --line:#2a3a43;
  --fg:#f3efe3; --mute:#9bb0b8; --taxi:#f2b81c; --taxi2:#ffd65a;
  --nile:#1d5a70; --bad:#ff6b5e; --good:#5fd38d;
  --ui:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --disp:'Cairo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ink);color:var(--fg);font-family:var(--ui);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#f2b27a}
button{font-family:inherit;color:inherit}
.hide{display:none!important}

#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.chip{background:rgba(11,19,23,.78);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.chip b{font-size:17px;color:var(--taxi2);font-variant-numeric:tabular-nums}
#fuelwrap{flex:1;max-width:190px;min-width:90px;display:flex;flex-direction:column;gap:3px}
#fuelbar{height:9px;background:#26343b;border-radius:5px;overflow:hidden}
#fuelfill{height:100%;width:100%;background:var(--good);transition:width .2s}
#fuelwrap small{font-size:11px;color:var(--mute);display:flex;justify-content:space-between}
#pausebtn{pointer-events:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(11,19,23,.78);font-size:16px;font-weight:900;cursor:pointer}
#mission{position:absolute;top:calc(58px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(92vw,520px);background:rgba(11,19,23,.84);border:1px solid var(--taxi);border-radius:12px;padding:6px 14px;font-weight:700;font-size:14px;text-align:center;line-height:1.5}
#mission small{display:block;color:var(--mute);font-weight:500;font-size:12px}
#mm{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:calc(56px + env(safe-area-inset-top,0px));width:132px;height:102px;border:1px solid var(--line);border-radius:10px;background:rgba(11,19,23,.7)}
#spd{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--disp);font-size:30px;line-height:1;text-align:center;text-shadow:0 2px 6px #000}
#spd small{display:block;font-family:var(--ui);font-size:11px;color:var(--mute);font-weight:700}
#hint{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:auto}
#hint button{background:var(--taxi);color:#17120a;border:0;border-radius:12px;padding:10px 18px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:30px;text-align:center;text-shadow:0 3px 10px #000;opacity:0;transition:opacity .25s;max-width:90vw}
#toast.on{opacity:1}
#big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--disp);font-size:96px;color:var(--taxi2);text-shadow:0 4px 18px #000}
#bub{position:absolute;left:0;top:0;background:rgba(255,255,255,.96);color:#17120a;border-radius:12px;padding:5px 12px;font-weight:700;font-size:14px;max-width:min(80vw,300px);text-align:center;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.4)}

#tc{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(11,19,23,.55);font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.on{background:rgba(242,184,28,.55);border-color:var(--taxi2)}
#bL{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px}
#bR{left:calc(100px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px}
#bG{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:84px;height:84px;font-size:15px;background:rgba(42,140,90,.5)}
#bB{right:calc(108px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:68px;height:68px;font-size:14px;background:rgba(190,60,50,.5)}
#bH{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:46px;height:46px;font-size:12px}
#bF{right:calc(74px + env(safe-area-inset-right,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));width:46px;height:46px;font-size:18px}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,11,14,.7);padding:16px;overflow:auto;touch-action:pan-y}
.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card h1{font-family:var(--disp);font-weight:400;font-size:46px;line-height:1.05;margin:0;color:var(--taxi2)}
.card h2{font-family:var(--disp);font-weight:400;font-size:30px;margin:0;color:var(--taxi2)}
.card p{margin:0;color:var(--mute);font-size:14px;line-height:1.7}
.stripe{height:10px;border-radius:3px;background:repeating-linear-gradient(45deg,#101010 0 14px,var(--taxi) 14px 28px)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;font-size:17px;cursor:pointer;background:var(--taxi);color:#17120a;min-height:48px}
.btn.alt{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;min-width:120px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stats div{flex:1;min-width:90px;background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:19px;color:var(--fg);font-variant-numeric:tabular-nums}
.keys{font-size:12.5px;color:var(--mute);line-height:1.9}
.keys kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit;color:var(--fg)}
.cars{display:flex;flex-direction:column;gap:10px}
.car{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.car.sel{border-color:var(--taxi)}
.car h3{margin:0;font-size:17px;display:flex;justify-content:space-between}
.bar{height:6px;border-radius:3px;background:#26343b;overflow:hidden}
.bar i{display:block;height:100%;background:var(--taxi)}
.lbl{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
#err{color:var(--bad);font-weight:700;font-size:14px}
